<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">二十四节气 · 农时拼图</title>
  <desc id="desc">深色漆底上金朱节气环与农时标题构成的主视觉</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#3a2614"/>
      <stop offset="70%" stop-color="#120B07"/>
      <stop offset="100%" stop-color="#0A0705"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="#C9A24B" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="52" y="52" width="1096" height="526" fill="none" stroke="#C9A24B" stroke-opacity="0.15" stroke-width="1"/>

  <!-- seasonal ring -->
  <g transform="translate(820 315)">
    <circle r="168" fill="none" stroke="#C9A24B" stroke-opacity="0.35" stroke-width="1"/>
    <circle r="132" fill="none" stroke="#C9A24B" stroke-opacity="0.22" stroke-width="1"/>
    <circle r="88" fill="#1A130C" stroke="#C82E21" stroke-opacity="0.7" stroke-width="2"/>
    <text text-anchor="middle" y="-8" fill="#E8CF9A" font-family="Georgia, serif" font-size="28" letter-spacing="8">二十四</text>
    <text text-anchor="middle" y="28" fill="#F5EDE0" font-family="Georgia, serif" font-size="34" letter-spacing="10">节气</text>
    <!-- 24 ticks -->
    <g stroke="#C9A24B" stroke-width="2">
      <g transform="rotate(0)"><line y1="-150" y2="-168" stroke-opacity="0.85"/></g>
      <g transform="rotate(15)"><line y1="-150" y2="-168" stroke-opacity="0.45"/></g>
      <g transform="rotate(30)"><line y1="-150" y2="-168" stroke-opacity="0.85"/></g>
      <g transform="rotate(45)"><line y1="-150" y2="-168" stroke-opacity="0.45"/></g>
      <g transform="rotate(60)"><line y1="-150" y2="-168" stroke-opacity="0.85"/></g>
      <g transform="rotate(75)"><line y1="-150" y2="-168" stroke-opacity="0.45"/></g>
      <g transform="rotate(90)"><line y1="-150" y2="-168" stroke-opacity="0.85"/></g>
      <g transform="rotate(105)"><line y1="-150" y2="-168" stroke-opacity="0.45"/></g>
      <g transform="rotate(120)"><line y1="-150" y2="-168" stroke-opacity="0.85"/></g>
      <g transform="rotate(135)"><line y1="-150" y2="-168" stroke-opacity="0.45"/></g>
      <g transform="rotate(150)"><line y1="-150" y2="-168" stroke-opacity="0.85"/></g>
      <g transform="rotate(165)"><line y1="-150" y2="-168" stroke-opacity="0.45"/></g>
      <g transform="rotate(180)"><line y1="-150" y2="-168" stroke-opacity="0.85"/></g>
      <g transform="rotate(195)"><line y1="-150" y2="-168" stroke-opacity="0.45"/></g>
      <g transform="rotate(210)"><line y1="-150" y2="-168" stroke-opacity="0.85"/></g>
      <g transform="rotate(225)"><line y1="-150" y2="-168" stroke-opacity="0.45"/></g>
      <g transform="rotate(240)"><line y1="-150" y2="-168" stroke-opacity="0.85"/></g>
      <g transform="rotate(255)"><line y1="-150" y2="-168" stroke-opacity="0.45"/></g>
      <g transform="rotate(270)"><line y1="-150" y2="-168" stroke-opacity="0.85"/></g>
      <g transform="rotate(285)"><line y1="-150" y2="-168" stroke-opacity="0.45"/></g>
      <g transform="rotate(300)"><line y1="-150" y2="-168" stroke-opacity="0.85"/></g>
      <g transform="rotate(315)"><line y1="-150" y2="-168" stroke-opacity="0.45"/></g>
      <g transform="rotate(330)"><line y1="-150" y2="-168" stroke-opacity="0.85"/></g>
      <g transform="rotate(345)"><line y1="-150" y2="-168" stroke-opacity="0.45"/></g>
    </g>
    <!-- season dots -->
    <circle cx="0" cy="-168" r="6" fill="#6B9B6E"/>
    <circle cx="168" cy="0" r="6" fill="#C9A24B"/>
    <circle cx="0" cy="168" r="6" fill="#C87A3A"/>
    <circle cx="-168" cy="0" r="6" fill="#6A8CA8"/>
  </g>

  <!-- left copy -->
  <text x="110" y="210" fill="#C9A24B" font-family="Georgia, serif" font-size="20" letter-spacing="10">农时拼图</text>
  <text x="110" y="290" fill="#F5EDE0" font-family="Georgia, serif" font-size="64" letter-spacing="8">二十四节气</text>
  <text x="110" y="350" fill="rgba(232,220,196,0.72)" font-family="Georgia, serif" font-size="24" letter-spacing="4">排序 · 物候配对 · 节气问答</text>
  <text x="110" y="420" fill="rgba(232,220,196,0.5)" font-family="Georgia, serif" font-size="18" letter-spacing="3">把一年拆成 24 段可玩的时间</text>
  <rect x="110" y="460" width="72" height="2" fill="#C82E21"/>
</svg>
