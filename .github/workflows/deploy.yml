name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

      - name: Audit public/ for unreferenced assets
        run: pnpm assets:check

      - name: Build static site
        env:
          # 静态导出：埋点配置在构建期内联进产物，故必须在这一步注入。
          # 未配置 secret 时构建照常通过，埋点自动降级为 no-op。
          NEXT_PUBLIC_ANALYTICS_PROVIDER: ga4
          NEXT_PUBLIC_ANALYTICS_SITE_ID: ${{ secrets.ANALYTICS_SITE_ID }}
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
